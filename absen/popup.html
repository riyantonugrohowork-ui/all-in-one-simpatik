<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Rekap Absen Downloader</title>
  <style>
    body {
      width: 100%;
      box-sizing: border-box;
      font-family: Segoe UI, Arial, sans-serif;
      padding: 12px;
      margin: 0;
    }
    h3 {
      margin: 0 0 8px;
      font-size: 15px;
    }
    .status {
      font-size: 12px;
      color: #444;
      margin-bottom: 8px;
    }
    .status b {
      color: #000;
    }
    .progress-bar-wrap {
      background: #eee;
      border-radius: 6px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar {
      height: 100%;
      background: #4680ff;
      width: 0%;
      transition: width 0.3s ease;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    button {
      flex: 1;
      padding: 8px 4px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    #btnStart { background: #28a745; color: #fff; }
    #btnStop { background: #dc3545; color: #fff; }
    #btnResume { background: #4680ff; color: #fff; }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #log {
      background: #111;
      color: #0f0;
      font-family: Consolas, monospace;
      font-size: 10px;
      height: 160px;
      overflow-y: auto;
      padding: 6px;
      border-radius: 6px;
      white-space: pre-wrap;
    }
    .hint {
      font-size: 11px;
      color: #a00;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <h3>Rekap Absen Downloader</h3>
  <div class="hint" id="hint" style="display:none;">Buka halaman rekap bulanan ASN dulu.</div>
  <div class="status">
    Status: <b id="statusText">Idle</b><br>
    Sedang: <b id="currentEmployee">-</b><br>
    Progres: <b id="progressText">0 / 0</b>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="btn-row">
    <button id="btnStart">Start</button>
    <button id="btnResume">Resume</button>
    <button id="btnStop">Stop</button>
  </div>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
