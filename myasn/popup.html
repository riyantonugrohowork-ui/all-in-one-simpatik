<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { width: 100%; margin: 0; padding: 12px; font-family: 'Segoe UI', sans-serif; font-size: 13px; }
    h3 { margin: 0 0 8px; font-size: 14px; }
    .section { margin-bottom: 14px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    label { display: block; margin: 6px 0 2px; font-weight: 600; }
    input[type="text"] { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    button { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-success { background: #198754; color: #fff; width: 100%; }
    .btn-primary { background: #0d6efd; color: #fff; width: 100%; }
    .btn-all { background: #6f42c1; color: #fff; width: 100%; margin-top: 4px; }
    .info { font-size: 11px; color: #888; margin: 2px 0 4px; }
    #status { margin-top: 10px; padding: 8px; border-radius: 4px; display: none; font-size: 12px; }
    .ok { background: #d1e7dd; color: #0f5132; }
    .err { background: #f8d7da; color: #842029; }
    .info-box { background: #cff4fc; color: #055160; }
  </style>
</head>
<body>
  <h3>MYASN Input Bukti Dukung</h3>

  <div class="section">
    <h3>Bukti Dukung</h3>
    <label>Nama Bukti Dukung</label>
    <input type="text" id="eviden" placeholder="Contoh: Bukti Dukung Bulan September 2026" value="Bukti Dukung">
    <label>Link (Google Drive / Dropbox / dll)</label>
    <input type="text" id="buktiLink" placeholder="https://drive.google.com/...">
    <div style="height:8px"></div>
    <button class="btn-success" id="btnBukti">Isi Semua Bukti Dukung</button>
  </div>

  <div class="section">
    <h3>Realisasi</h3>
    <div class="info">Kuantitas &amp; Kualitas:</div>
    <label>Realisasi</label>
    <input type="text" id="realisasiNonWaktu" value="95%">
    <label>Sumber Data</label>
    <input type="text" id="sumberDataNonWaktu" value="Prosentase">
    <div class="info" style="margin-top:6px">Waktu:</div>
    <label>Realisasi (Waktu)</label>
    <input type="text" id="realisasiWaktu" value="1 bulan">
    <label>Sumber Data (Waktu)</label>
    <input type="text" id="sumberDataWaktu" value="Prosentase">
    <div style="height:8px"></div>
    <button class="btn-primary" id="btnRealisasi">Isi Semua Realisasi</button>
  </div>

  <button class="btn-all" id="btnAll">Isi Semua (Bukti + Realisasi)</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
